<!DOCTYPE html>

  <title>Nani</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);

      justify-content: center;
      align-items: center;

    .card {

    h1 {
      margin: 0;
      color: #222;

    }

      margin-top: 10px;
      color: #555;
      font-size: 1.1rem;

</html>
